# ローカル開発環境
#   docker compose up
#   - API: http://localhost:8088  (API_PORT で変更可)
#   - Web: http://localhost:4321
services:
  api:
    build: ./api/docker
    volumes:
      - ./api:/app
    ports:
      - "${API_PORT:-8088}:8000"
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./web:/app
      # Windows 側の node_modules と混ざらないようにコンテナ専用ボリュームにする
      - web_node_modules:/app/node_modules
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: http://localhost:${API_PORT:-8088}
      # ファイル変更をポーリングで検知してホットリロードする（astro.config.mjs 参照）
      WATCH_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  web_node_modules:
