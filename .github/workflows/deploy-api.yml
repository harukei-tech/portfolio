# Laravel API をテストし、main への push 時に AWS Lambda (Bref) へデプロイする
name: API (test & deploy)

on:
  # API は一旦停止中のため、自動実行（push / pull_request）は止めて手動実行のみにしている。
  # 再開するときは以下のコメントを外す。
  # push:
  #   branches: [main]
  #   paths: ['api/**', '.github/workflows/deploy-api.yml']
  # pull_request:
  #   paths: ['api/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # AWS への OIDC 認証に必要

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: cp .env.example .env && php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # 本番用に dev 依存を除いてインストール
      - run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - run: npm ci

      # アクセスキーを使わず、GitHub OIDC で IAM ロールを引き受ける（README 参照）
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - run: npx osls deploy --stage prod
